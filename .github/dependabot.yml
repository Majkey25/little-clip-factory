# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "25 8 * * 0,3"
      timezone: Etc/UTC
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "21 0 * * 2,6"
      timezone: Etc/UTC
